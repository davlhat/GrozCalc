name: GrozCalc checks
on:
  push:
    branches: [dev/initial-prototype, main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: server
      - run: node --check src/index.js
        working-directory: server
      - run: node --check src/migrate.js
        working-directory: server
