services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: grozcalc
      POSTGRES_USER: grozcalc
      POSTGRES_PASSWORD: grozcalc
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - grozcalc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grozcalc -d grozcalc"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  grozcalc_pgdata:
